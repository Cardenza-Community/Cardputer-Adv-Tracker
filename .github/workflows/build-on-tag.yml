name: Build Binary on Tag

on:
  push:
    tags:
      - 'v*'
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build runtime Cardputer image
        run: |
          python -m pip install platformio==6.2.0
          python -m platformio run -e cardenza -j4
          python .github/launcher/test_nvs_guard.py

      - name: Prepare app-only binary and notices
        run: |
          python .github/launcher/prepare.py .pio/build/cardenza/firmware.bin .pio/libdeps/cardenza/M5Cardputer/src/M5Cardputer.h
          cp .pio/build/cardenza/firmware.bin CardputerTracker-${{ github.ref_name }}.bin

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            CardputerTracker-${{ github.ref_name }}.bin
            .git/launcher-output/Cardenza.bin
            .git/launcher-output/NOTICES.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
